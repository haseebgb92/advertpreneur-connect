name: Advertpreneur Connect release checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test backend security and route behavior
        run: npm test
      - name: Build Next.js application
        run: npm run build
      - name: PHP syntax check
        run: find wordpress/advertpreneur-connect -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify release archives and declared MCP tool names
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, re
          root=pathlib.Path('skills/advertpreneur-connect')
          skill=root/'SKILL.md'
          assert skill.exists()
          body=skill.read_text()
          assert re.search(r'(?m)^name: advertpreneur-connect$',body)
          assert 'description:' in body and 'publish_post' in body and 'site_overlap_check' in body
          names=set(re.findall(r"registerTool\('([^']+)'",pathlib.Path('lib/mcp-tools.js').read_text()))
          required={'list_sites','site_status','create_draft','publish_post','quality_check','site_overlap_check','attest_quality','seo_status','get_image_requirements','import_image_url','upload_image_base64','create_product_draft'}
          assert required<=names, required-names
          for file in pathlib.Path('releases').glob('*.zip'):
            with zipfile.ZipFile(file) as z:
              assert z.testzip() is None, file
              assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist()),file
              assert z.namelist(),file
            print('Valid archive:',file)
          PY
